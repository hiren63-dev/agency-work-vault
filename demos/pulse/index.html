<style>
/* ── Light Theme (Default) ───────────────── */
:root {
  --bg-0: #f4f3ef;
  --bg-1: #ffffff;
  --bg-2: #fafaf8;
  --bg-3: #f1ede8;
  --bg-4: #e5e0d9;
  --border: rgba(28,25,23,0.09);
  --border-strong: rgba(28,25,23,0.17);
  --t-1: #1c1917;
  --t-2: #57534e;
  --t-3: #a8a29e;
  --accent: #2563eb;
  --accent-muted: rgba(37,99,235,0.09);
  --accent-hover: rgba(37,99,235,0.16);
  --success: #059669;
  --warning: #d97706;
  --danger:  #dc2626;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.07),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.09);
  --base-font-size: 16px;
}
/* ── Dark Theme ──────────────────────────── */
[data-theme="dark"] {
  --bg-0: #09090b;
  --bg-1: #0d0d11;
  --bg-2: #111116;
  --bg-3: #18181f;
  --bg-4: #1f1f2a;
  --border: rgba(255,255,255,0.07);
  --border-strong: rgba(255,255,255,0.13);
  --t-1: #f0f0f4;
  --t-2: #8888a2;
  --t-3: #46465a;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.45);
}
/* ── Warm Theme ──────────────────────────── */
[data-theme="warm"] {
  --bg-0: #fef8ee;
  --bg-1: #fffdf8;
  --bg-2: #fdf5e4;
  --bg-3: #f8ead0;
  --bg-4: #efd9b0;
  --border: rgba(120,80,40,0.11);
  --border-strong: rgba(120,80,40,0.20);
  --t-1: #2c1b00;
  --t-2: #7c5c3a;
  --t-3: #b89c7a;
  --shadow-sm: 0 1px 3px rgba(120,80,40,0.08);
  --shadow-md: 0 4px 16px rgba(120,80,40,0.10);
}
/* ── Reset ───────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'DM Sans', 'Helvetica Neue', sans-serif;
  letter-spacing: -0.01em;
  background:var(--bg-0); color:var(--t-1);
  min-height:100vh; -webkit-font-smoothing:antialiased;
  font-size:var(--base-font-size,16px); line-height:1.65;
}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;}
/* ── Animations ──────────────────────────── */
@keyframes modalIn{from{opacity:0;transform:scale(0.96) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes toastIn{from{opacity:0;transform:translateX(60px);}to{opacity:1;transform:translateX(0);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
/* ── Nav Button ──────────────────────────── */
.nav-btn{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:11px 14px;border-radius:10px;cursor:pointer;
  font-family:inherit;font-size:15px;font-weight:500;letter-spacing:-0.005em;
  color:var(--t-2);background:transparent;border:none;
  transition:background 0.15s,color 0.15s;margin-bottom:2px;
  text-align:left;white-space:nowrap;
}
.nav-btn:hover{background:var(--bg-3);color:var(--t-1);}
.nav-btn.nav-active{background:var(--accent-muted)!important;color:var(--accent)!important;font-weight:600;}
input,select,textarea,button{font-family:inherit;}
input[type="number"]{-moz-appearance:textfield;}
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;}
#root{min-height:100vh;}
</style>
